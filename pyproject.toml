[project]
name = "plcgateway-v3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Toshi-0515", email = "161176815+toshi0515@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "paho-mqtt>=2.1.0",
    "pydantic>=2.13.5",
    "pymcprotocol>=0.3.0",
    "pyyaml>=6.0.3",
]

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[project.scripts]
plcgateway = "plcgateway_v3.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
]
